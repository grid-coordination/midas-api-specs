openapi: 3.1.0
info:
  title: MIDAS ValueData API
  version: 2.0.0
  description: |
    Unofficial OpenAPI specification for the California Energy Commission's
    [MIDAS](https://midasapi.energy.ca.gov/) ValueData endpoint.

    **This is the MIDAS v2.0 spec (CEC release 2026-06-22).** GET endpoints are
    unauthenticated, the RIN-list response is a keyed object (was a bare array
    in v1.0), the value field is `Value` (was lowercase `value`), SGIP GHG is
    reported in `g/kWh CO2` (was `kg/kWh CO2`), and all wire datetimes are UTC.
    See [doc/v2-migration.md](https://github.com/grid-coordination/midas-api-specs/blob/v2/doc/v2-migration.md)
    for the full v1.0 → v2.0 delta.

    Derived from the [MIDAS documentation](https://github.com/california-energy-commission/MIDAS)
    on a best-effort basis. May be incomplete, inaccurate, or out of date.

    The ValueData endpoint is overloaded — it serves four distinct operations
    depending on which query parameters are supplied:

    1. **RIN List** — `?SignalType={0-3}` — list available Rate Identification Numbers (keyed object in v2.0)
    2. **Rate Values** — `?ID={RIN}&QueryType={alldata|realtime}` — retrieve rate/price data
    3. **Lookup Table** — `?LookupTable={name}` — retrieve reference data (codes & descriptions)
    4. **XML Schema** — no parameters — retrieve the upload XML schema

    This is a single REST endpoint with multiplexed behavior, not four separate
    resources. We document them as separate operations for clarity, but they all
    hit the same URL.
  contact:
    name: Clark Communications Corporation
    url: https://github.com/grid-coordination/midas-api-specs
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://midasapi.energy.ca.gov/api
    description: MIDAS Production

paths:
  /ValueData:
    get:
      summary: Query rate data, RIN lists, lookup tables, or the upload schema
      description: |
        The ValueData endpoint serves multiple functions depending on which
        query parameters are provided. Supply exactly one of the following
        parameter combinations:

        - `SignalType` alone → RIN list (keyed object)
        - `ID` + `QueryType` → rate/price values
        - `LookupTable` alone → reference lookup table
        - No parameters → XML upload schema

        **Authentication:** In v2.0 all GET calls are unauthenticated — no bearer
        token is required. A token is still accepted (e.g. for lookup-table
        calls) but never required for public GET data. The `bearerAuth` scheme
        remains defined for upload operations documented elsewhere.
      operationId: getValueData
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: SignalType
          in: query
          description: |
            Return all RINs of the specified signal type.
            Mutually exclusive with ID, QueryType, and LookupTable.
          required: false
          schema:
            $ref: '#/components/schemas/SignalTypeParam'
        - name: ID
          in: query
          description: |
            The Rate Identification Number (RIN) to query.
            Must be accompanied by QueryType.
          required: false
          schema:
            type: string
            pattern: '^[A-Z]{2}[A-Z]{2}-[A-Z0-9]{2}[A-Z0-9]{2}-[A-Z0-9]{4}-[A-Z0-9]{2,10}$'
            examples:
              - USCA-TSTS-TTOU-TEST
              - USCA-PGPG-ETOU-0000
              - USCA-SGIP-MOER-PGE
              - USCA-FLEX-ALRT-0000
        - name: QueryType
          in: query
          description: |
            The type of data to return for the specified RIN.
            Must be accompanied by ID.

            - `realtime` — v2.0 returns a fixed **72-hour window** starting at
              midnight Pacific on the request date (regardless of signal type).
              For SGIP GHG/MOER this is a continuous 5-minute series blending
              past observed data, current readings, and WattTime forecast.
            - `alldata` — v2.0 returns a fixed **90-day window** ending 23:59:59
              Pacific on Day+2. For ranges beyond 90 days use the HistoricalData
              endpoint (max 6 months per call).

            Window boundaries are PT-aligned but expressed as UTC on the wire
            (midnight Pacific = `07:00:00` UTC during PDT, `08:00:00` UTC during
            PST). See doc/datetime-and-timezone.md.
          required: false
          schema:
            type: string
            enum:
              - alldata
              - realtime
        - name: LookupTable
          in: query
          description: |
            The name of the lookup table to retrieve.
            Mutually exclusive with SignalType, ID, and QueryType.
          required: false
          schema:
            type: string
            enum:
              - Country
              - Daytype
              - Distribution
              - Enduse
              - Energy
              - Location
              - Ratetype
              - Sector
              - State
              - Unit
      responses:
        '200':
          description: |
            Successful response. The shape depends on which parameters were supplied:
            - SignalType → keyed object; on live v2.0 the wrapper key is always "Rates" (regardless of SignalType)
            - ID + QueryType → single RateInfo object (not an array, despite what the docs imply)
            - LookupTable → keyed object { table_name, data: [LookupEntry] }
            - No params → XML schema as a JSON-encoded string
          content:
            application/json:
              schema:
                oneOf:
                  - title: RIN List
                    $ref: '#/components/schemas/RinListResponse'
                  - title: Rate Values
                    $ref: '#/components/schemas/RateInfo'
                  - title: Lookup Table
                    $ref: '#/components/schemas/LookupTableResponse'
                  - title: XML Schema
                    type: string
        '404':
          description: |
            Not found — e.g. an unknown RIN, or a removed resource. In v2.0
            the `?LookupTable=Holiday` and `?LookupTable=TimeZone` tables
            return 404.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Obtain a 10-minute bearer token from the /Token endpoint using
        HTTP Basic authentication, then pass it as `Authorization: Bearer {token}`.

  schemas:
    SignalTypeParam:
      type: integer
      enum:
        - 0
        - 1
        - 2
        - 3
      description: |
        Signal type filter for RIN list queries:
        - 0 = All
        - 1 = Electricity rates
        - 2 = Greenhouse gas emissions
        - 3 = California ISO Flex Alert

    RinListResponse:
      type: object
      description: |
        v2.0 RIN-list response. The bare array of v1.0 is replaced by a
        single-keyed object. On the live v2.0 API the wrapper key is **always
        `Rates`**, regardless of the requested SignalType (confirmed
        2026-06-22 for SignalType 0/1/2/3 — the `GHGEmissions`, `FlexAlerts`,
        and `All` keys implied by early design notes do not appear on the
        wire). Consumers should peel the single value without switching on the
        key name. The per-entry `SignalType` field still identifies each RIN's
        signal type.
      required:
        - Rates
      additionalProperties: false
      properties:
        Rates:
          type: array
          items:
            $ref: '#/components/schemas/RinListEntry'

    RinListEntry:
      type: object
      description: A RIN entry returned by the SignalType query.
      required:
        - RateID
        - SignalType
        - Description
      properties:
        RateID:
          type: string
          description: The Rate Identification Number (RIN).
          examples:
            - USCA-TSTS-TTOU-TEST
        SignalType:
          type: string
          description: |
            Human-readable signal type. v2.0 populates this for every entry
            (v1.0 returned null for GHG and Flex Alert entries).
          enum:
            - Electricity Rates
            - Greenhouse Gas Emissions
            - California Independent System Operator Flex Alert
        Description:
          type: string
          description: Human-readable description including distribution and energy providers.
          examples:
            - "Rate Data for Distributor: Test, Energy Company: Test"
        LastUpdated:
          type: string
          format: date-time
          description: |
            Timestamp of the last update to this RIN's data (UTC). On live
            v2.0 this carries a **basic-format UTC offset** (`±HHMM`, e.g.
            `+0000`) with no colon — confirmed 2026-06-22, resolving the v1.0
            bare/zoneless form. Note: `+0000` is ISO 8601 but not RFC 3339, so
            strict RFC-3339 parsers (e.g. Java `ISO_OFFSET_DATE_TIME`, which
            requires `+00:00`) reject it; parse with a lenient formatter that
            accepts `+0000`, `+00:00`, and `Z`.
          examples:
            - "2021-07-14T14:31:55+0000"
            - "2026-05-22T15:23:43+0000"

    RateInfo:
      type: object
      description: |
        Rate information and associated time-series values for a single RIN.
        Returned by the ID + QueryType query.
      required:
        - RateID
        - RateName
        - RateType
        - ValueInformation
      properties:
        RateID:
          type: string
          description: The Rate Identification Number (RIN).
          examples:
            - USCA-TSTS-TTOU-TEST
        SystemTime_UTC:
          type: string
          format: date-time
          description: Server timestamp of the response in UTC.
          examples:
            - "2023-03-21T16:34:42.906Z"
        RateName:
          type: string
          description: Name of the rate as provided by the uploading party.
          examples:
            - CEC TEST24HTOU
        RateType:
          type:
            - string
            - "null"
          description: |
            Rate classification. The wire value is **inconsistent across signal
            types** (confirmed against live v2.0, 2026-06-22):

            - Electricity rates return the short `Ratetype` lookup UploadCode —
              e.g. `TOU`, `CPP`, `RTP`, `VPP`, `DSR`, `V-D`, `C-D`, `R-D`,
              `T-D` (not the long Description).
            - SGIP GHG returns the long Description `Greenhouse Gas emissions`.
            - Flex Alert returns the long Description `Flex Alert`.

            So electricity rates expose the short code while GHG/Flex expose the
            long Description. Consumers should match on both forms. May be null
            for some entries.
          examples:
            - TOU
            - CPP
            - Greenhouse Gas emissions
            - Flex Alert
        Sector:
          type:
            - string
            - "null"
          description: |
            Customer sector or null. GET responses return long descriptions
            (e.g. "All sectors") rather than upload codes (e.g. "All").
          examples:
            - All sectors
            - Residential
        EndUse:
          type:
            - string
            - "null"
          description: End use category (All, EV, Solar, Battery, Other) or null.
        API_Url:
          type:
            - string
            - "null"
          description: |
            API URL as provided by uploading party, or null.
            Note: The live API may return the literal string "None" instead
            of JSON null when no URL is set.
        RatePlan_Url:
          type:
            - string
            - "null"
          format: uri
          description: Link to rate schedule as provided by uploading party, or null.
        AltRateName1:
          type:
            - string
            - "null"
          description: Alternate rate name, or null.
        AltRateName2:
          type:
            - string
            - "null"
          description: Another alternate rate name, or null.
        SignupCloseDate:
          type:
            - string
            - "null"
          format: date-time
          description: |
            Last day to sign up for the rate, or null. The upstream docs
            describe this as a date, but the live API returns a full
            ISO 8601 datetime (e.g. "2024-12-31T00:00:00.000Z").
        ValueInformation:
          type: array
          description: Time-series collection of price/value intervals.
          items:
            $ref: '#/components/schemas/ValueData'

    ValueData:
      type: object
      description: |
        A single time-series interval with a price or emissions value.
        Dates and times are in UTC; DayStart/DayEnd reflect local-time day type.
      required:
        - ValueName
        - DateStart
        - DateEnd
        - DayStart
        - DayEnd
        - TimeStart
        - TimeEnd
        - Value
        - Unit
      properties:
        ValueName:
          type: string
          description: Description of the interval (e.g. "summer on peak", "winter off peak").
          examples:
            - winter off peak
            - winter on peak
            - summer on peak
        DateStart:
          type: string
          format: date
          description: Date of interval start in UTC (ISO 8601).
          examples:
            - "2023-03-01"
        DateEnd:
          type: string
          format: date
          description: Date of interval end in UTC (ISO 8601).
          examples:
            - "2023-03-01"
        DayStart:
          type:
            - string
            - "null"
          description: |
            Day type of interval start in local time, as a human-readable
            string, or null (observed in HistoricalData responses).

            Upload format uses integers: 1=Monday through 7=Sunday, 8=Holiday.
            GET response format uses strings: "Monday" through "Sunday", "Holiday".
          examples:
            - Monday
            - Tuesday
            - Holiday
        DayEnd:
          type:
            - string
            - "null"
          description: Day type of interval end in local time. Same encoding as DayStart, or null.
          examples:
            - Monday
            - Friday
        TimeStart:
          type: string
          pattern: '^\d{2}:\d{2}(:\d{2})?$'
          description: |
            Time of interval start in UTC. Usually HH:MM:SS but Flex Alert
            responses use HH:MM (no seconds).
          examples:
            - "08:00:00"
            - "03:11"
        TimeEnd:
          type: string
          pattern: '^\d{2}:\d{2}(:\d{2})?$'
          description: |
            Time of interval end in UTC. Usually HH:MM:SS but Flex Alert
            responses use HH:MM (no seconds).
          examples:
            - "08:59:59"
            - "03:11"
        Value:
          type: number
          description: |
            The price or emissions value for this interval.

            v2.0 standardizes the field name as "Value" (capital V), correcting
            the v1.0 lowercase "value" quirk. SGIP GHG values are 1000× larger
            than v1.0 because the unit changed from kg/kWh to g/kWh CO2.
          examples:
            - 0.1006
            - 0.1388
        Unit:
          type: string
          description: |
            Unit for the value. Known units from the Unit lookup table:
            $/kWh, $/kW, export $/kWh, backup $/kWh,
            g/kWh CO2, $/kvarh, Event, Level. (SGIP GHG reports g/kWh CO2 in
            v2.0; was kg/kWh CO2 in v1.0.)
          examples:
            - "$/kWh"
            - "$/kW"
            - "export $/kWh"
            - "g/kWh CO2"

    LookupTableResponse:
      type: object
      description: |
        v2.0 lookup-table response. Like the RIN list, the bare array of v1.0
        is replaced by a keyed object — the table name plus a `data` array of
        rows (confirmed against live v2.0, 2026-06-22).
      required:
        - table_name
        - data
      additionalProperties: false
      properties:
        table_name:
          type: string
          description: The name of the lookup table.
          examples:
            - Unit
            - Ratetype
        data:
          type: array
          items:
            $ref: '#/components/schemas/LookupEntry'

    LookupEntry:
      type: object
      description: |
        An entry from a MIDAS lookup/reference table. All rows carry
        `UploadCode` and `Description`; some tables add extra columns (e.g. the
        `Unit` table adds `PayloadDescriptor` and `UnitType`), so additional
        properties are permitted.
      required:
        - UploadCode
        - Description
      additionalProperties: true
      properties:
        UploadCode:
          type: string
          description: The code used during rate uploads.
          examples:
            - PG
            - MC
            - "backup $/kWh"
        Description:
          type: string
          description: Human-readable description of the code.
          examples:
            - Pacific Gas and Electric
            - Marin Clean Energy
        PayloadDescriptor:
          type: string
          description: |
            Optional machine token for the row (present on the `Unit` table).
          examples:
            - BACKUP_PRICE
        UnitType:
          type: string
          description: |
            Optional unit category (present on the `Unit` table).
          examples:
            - KWH
